<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador PPTX</title>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgenjs.bundle.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;justify-content:center;align-items:center}

p{color:#94a3b8;margin-bottom:20px;font-size:13px}
.btn{padding:16px 40px;background:#3b82f6;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}

</style>
</head>
<body>

</div>

s=pptx.addSlide();
s.background={color:D};

s.addText('Saldo = $13.50\nPrecio = $13.50\n\nSe selecciono ruta y asiento.\nTransaccion aprobada.\nCodigo QR emitido.\n\nSaldo final: $0.00\n\nResultado: APROBADA',{x:0.5,y:1.5,w:5.8,h:5,fontSize:12,color:L,fill:{color:C},valign:'top'});
s.addText('CP-COMPRA-02: Saldo Insuficiente $13.49',{x:6.9,y:1,w:5.8,h:0.4,fontSize:14,color:RD,bold:true,fill:{color:C}});
s.addText('Saldo = $13.49 (-$0.01)\nPrecio = $13.50\n\nToast rojo: "Fondo insuficiente"\nTransaccion abortada.\n\nSaldo preservado.\n\nResultado: APROBADA',{x:6.9,y:1.5,w:5.8,h:5,fontSize:12,color:L,fill:{color:C},valign:'top'});

s=pptx.addSlide();
s.background={color:D};
s.addText('Modulo de Roles y Acceso',{x:0.5,y:0.2,w:12,h:0.6,fontSize:26,color:W,bold:true});
s.addText('CP-ROL-01: Restriccion Vistas Admin',{x:0.5,y:1,w:5.8,h:0.4,fontSize:14,color:B2,bold:true,fill:{color:C}});
s.addText('Con cuenta Admin:\n\nPanel Conductores -> VISIBLE\nEstadisticas -> VISIBLE\nBoton Comprar -> OCULTO\nQuick Action -> OCULTO\n\nRenderizado condicional OK.\n\nResultado: APROBADA',{x:0.5,y:1.5,w:5.8,h:5,fontSize:12,color:L,fill:{color:C},valign:'top'});
s.addText('CP-ROL-02: Directorio Usuarios',{x:6.9,y:1,w:5.8,h:0.4,fontSize:14,color:B2,bold:true,fill:{color:C}});

s=pptx.addSlide();
s.background={color:D};
s.addText('Modulo de Geolocalizacion',{x:0.5,y:0.2,w:12,h:0.6,fontSize:26,color:W,bold:true});

s.addText('CP-GEO-02: Corte de GPS',{x:6.9,y:1,w:5.8,h:0.4,fontSize:14,color:RD,bold:true,fill:{color:C}});
s.addText('Se desactivo GPS en tracking.\n\nApp detecto el cambio.\nMapa congelado.\nToast: "Se perdio senal GPS"\n\nSin crash. App estable.\n\nResultado: APROBADA',{x:6.9,y:1.5,w:5.8,h:5,fontSize:12,color:L,fill:{color:C},valign:'top'});

s=pptx.addSlide();
s.background={color:D};
s.addText('Validacion UI/UX - Cap. 20',{x:0.5,y:0.2,w:12,h:0.6,fontSize:26,color:W,bold:true});
s.addText('CP-UI-01: Tokens de Diseno',{x:0.5,y:1,w:5.8,h:0.4,fontSize:14,color:B2,bold:true,fill:{color:C}});
s.addText('Tokens verificados:\n- --color-primary: #1a3a6b\n- --color-green: #34c759\n- --font-family: Inter\n- --radius-md: 16px\n\nComponentes aislados:\nToast / Navbar / Icons\n\nResultado: APROBADA',{x:0.5,y:1.5,w:5.8,h:5,fontSize:12,color:L,fill:{color:C},valign:'top'});
s.addText('Videos de Evidencia',{x:6.9,y:1,w:5.8,h:0.4,fontSize:14,color:GN,bold:true,fill:{color:C}});
s.addText('Cada prueba grabada en video:\n\n1. CP-AUTH-01_Login.mp4\n2. CP-AUTH-02_XSS.mp4\n3. CP-PERF-01_Foto.mp4\n4. CP-COMPRA-01_Exacto.mp4\n5. CP-COMPRA-02_Insuf.mp4\n6. CP-ROL-01_Admin.mp4\n7. CP-ROL-02_Directorio.mp4\n8. CP-GEO-01_GPS.mp4\n9. CP-GEO-02_Corte.mp4\n10. CP-UI-01_Tokens.mp4',{x:6.9,y:1.5,w:5.8,h:5,fontSize:12,color:L,fill:{color:C},valign:'top'});

s=pptx.addSlide();
s.background={color:B};
s.addText('Conclusiones',{x:0.5,y:0.3,w:12.3,h:0.6,fontSize:28,color:W,bold:true,align:'center'});
s.addText('- 10 de 10 pruebas aprobadas (100%)\n- Cero incidentes de Severidad 1\n- Cobertura: Auth, Compras, Roles, Perfil, GPS, UI\n\n- Pruebas Criticas (AUTH, COMPRA, ROL): 100%\n- Sin caidas ni corrupcion de saldos\n- Codigo cumple SOLID y Early Return\n- Tokens de diseno atomico validados\n\nPremiumBus es apto para produccion.',{x:0.8,y:1.2,w:11.7,h:5.2,fontSize:16,color:L,fill:{color:C},valign:'top'});
s.addText('PremiumBus - Mayo 2026',{x:0.5,y:6.8,w:12.3,h:0.3,fontSize:12,color:GR,align:'center'});

pptx.writeFile({fileName:'Presentacion_Pruebas_PremiumBus.pptx'}).then(function(){
el.textContent='Descargada!';
el.style.color='#22c55e';
document.getElementById('b').disabled=false;
}).catch(function(e){
el.textContent='Error: '+e;
el.style.color='#ef4444';
document.getElementById('b').disabled=false;
});
}catch(e){
el.textContent='Error: '+e.message;
el.style.color='#ef4444';
document.getElementById('b').disabled=false;
}
},500);
}
</script>
</body>
</html>
